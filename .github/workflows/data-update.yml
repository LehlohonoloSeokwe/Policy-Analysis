name: Weekly Macroeconomic Data Harvest

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run World Bank & Official Statistics Harvester
        run: npm run data:update

      - name: Check for dataset changes
        id: git_status
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain public/data VERIFY.md) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for Review
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: weekly macroeconomic series harvest [automated]"
          title: "Weekly Macroeconomic Data Harvest (World Bank & Official Gazettes)"
          body: |
            Automated weekly harvest of South African macroeconomic datasets.
            
            - Updated `/public/data/*.json`
            - Refreshed audit statuses in `/VERIFY.md`
            
            Please review verified changes before merging to production.
          branch: automated-data-update
          delete-branch: true
